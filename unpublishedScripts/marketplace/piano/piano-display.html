    The piano's desk display, shown on the music desk to whoever sits at the piano. This is a
    WIREFRAME of the future interface: placeholder data, and buttons that only send a web event
    to piano-client.mjs, which prints it and acknowledges it back.

    Laid out in rem on a 50 x 17.1875 rem canvas: the 0.80 x 0.275 m desk face of
    piano-core.mjs DISPLAY_DEFAULTS, so 1 rem is 16 mm on the desk whatever the Web entity's
    pixel count, and body text is 16 mm tall at the seated player's 0.6-0.7 m. The root font
    size fits the canvas to the viewport, so another size or aspect from userData.piano.display
    scales the page rather than cropping it. Self-contained: no external fonts, scripts or images.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Desk Display</title>
<style>
    :root {
        --glass: #0b0d10;
        --line: #8a939d;
        --faint: #454c56;
        --text: #e2e6ea;
        --label: #9aa3ad;
        --mark: #f2f4f6;
        /* 50 x 17.1875 rem fitted into the viewport */
        font-size: min(2vw, 5.818vh);
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--glass);
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text);
        font: 1rem/1.2 "DejaVu Sans", "Segoe UI", Helvetica, Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
    }
    .frame {
        display: grid;
        grid-template-columns: 30rem 1fr;
        grid-template-rows: 2rem 1fr;
        gap: 0.6rem;
        width: 50rem;
        height: 17.1875rem;
        padding: 0.5rem;
    }
    /* A wireframe region: dashed outline with its name tagged on the top edge */
    .region {
        position: relative;
        border: 0.0625rem dashed var(--line);
        padding: 0.75rem 0.6rem 0.4rem;
        min-width: 0;
        min-height: 0;
    }
    .region > .tag {
        position: absolute;
        top: -0.45rem;
        left: 0.5rem;
        padding: 0 0.25rem;
        background: var(--glass);
        color: var(--label);
        font-size: 0.75rem;
        line-height: 0.9rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }
    .status {
        grid-column: 1 / 3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0 0.6rem;
        font-size: 0.875rem;
    }
    .status strong { color: var(--mark); letter-spacing: 0.1em; font-size: 0.875rem; }
    .indicators { display: flex; gap: 1rem; color: var(--label); white-space: nowrap; }
    .indicator { display: flex; align-items: center; gap: 0.35rem; }
    .indicator svg { width: 0.8rem; height: 0.8rem; }
    #last { color: var(--text); }
    .left { display: grid; grid-template-rows: auto auto 1fr; gap: 0.6rem; min-height: 0; }
    .now { display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 0.75rem; }
    .title { grid-column: 1 / 3; font-size: 1.75rem; line-height: 2.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .composer { color: var(--label); }
    .state {
        padding: 0 0.6rem;
        border: 0.0625rem solid var(--line);
        border-radius: 0.6rem;
        font-size: 0.875rem;
        text-transform: lowercase;
    }
    .progress { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.6rem; }
    .bar { height: 0.6rem; border: 0.0625rem solid var(--line); }
    .bar > div { height: 100%; width: 45%; background: repeating-linear-gradient(135deg, var(--line) 0 0.12rem, transparent 0.12rem 0.36rem); }
    .times { color: var(--label); font-size: 0.875rem; }
    .buttons { display: flex; justify-content: space-between; height: 100%; align-items: center; }
    button {
        font: inherit;
        color: var(--text);
        background: transparent;
        border: 0.0625rem solid var(--line);
        cursor: pointer;
    }
    button:active { background: var(--faint); }
    .transport button {
        width: 5.4rem;
        height: 2.9rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.15rem;
        font-size: 0.75rem;
    }
    .transport svg { width: 1.4rem; height: 1.4rem; }
    .songs { display: flex; flex-direction: column; }
    .songs ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
    .songs button {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        text-align: left;
        padding: 0.25rem 0.5rem;
        border-color: var(--faint);
    }
    .songs button.current { border-color: var(--mark); border-width: 0.125rem; padding: 0.1875rem 0.4375rem; }
    .songs .song { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .songs .length { padding-left: 0.5rem; font-size: 0.875rem; color: var(--label); }
    .more { margin-top: auto; font-size: 0.75rem; color: var(--label); }
</style>
</head>
<body>
<main class="frame">
    <section class="region status" aria-label="Status bar">
        <span class="tag">status bar</span>
        <span><strong>WIREFRAME</strong> &middot; placeholder data</span>
        <span class="indicators">
            <span class="indicator" title="Orpheus connection (placeholder)">
                <svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="6" r="2" fill="currentColor"/></svg>
                <span>Orpheus: connected</span>
            </span>
            <span class="indicator" title="EventBridge to the piano's client script">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h3M8 6h3M4 3.5h4v5H4z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                <span id="bridge">Script: checking</span>
            </span>
            <span id="last">no button pressed</span>
        </span>
    </section>

    <div class="left">
        <section class="region now" aria-label="Now playing">
            <span class="tag">now playing</span>
            <div class="title">Gymnopedie No. 1</div>
            <div class="composer">Erik Satie</div>
            <span class="state">playing</span>
        </section>

        <section class="region progress" aria-label="Progress">
            <span class="tag">progress</span>
            <span class="times">1:24</span>
            <div class="bar"><div></div></div>
            <span class="times">3:05</span>
        </section>

        <section class="region transport" aria-label="Transport">
            <span class="tag">transport</span>
            <div class="buttons">
                <button data-action="previous" aria-label="Previous">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 5l-9 7 9 7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                    previous
                </button>
                <button data-action="pause" aria-label="Play or pause">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5l9 7-9 7zM15 5v14M20 5v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                    play/pause
                </button>
                <button data-action="stop" aria-label="Stop">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
                    stop
                </button>
                <button data-action="next" aria-label="Next">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 5l9 7-9 7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                    next
                </button>
                <button data-action="replay" aria-label="Replay">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.1-5M5 4v4h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    replay
                </button>
            </div>
        </section>
    </div>

    <section class="region songs" aria-label="Song list">
        <span class="tag">song list</span>
        <ul>
            <li><button data-song="1"><span class="song">Ode to Joy</span><span class="length">0:16</span></button></li>
            <li><button data-song="2" class="current"><span class="song">Gymnopedie No. 1</span><span class="length">3:05</span></button></li>
            <li><button data-song="3"><span class="song">Clair de Lune</span><span class="length">5:02</span></button></li>
            <li><button data-song="4"><span class="song">Prelude in C</span><span class="length">2:20</span></button></li>
            <li><button data-song="5"><span class="song">Nocturne Op. 9 No. 2</span><span class="length">4:33</span></button></li>
        </ul>
        <div class="more">+7 more (scrolls)</div>
    </section>
</main>
<script>
    "use strict";
    // Interface injects EventBridge into Web entity pages; a desktop browser preview has none.
    var bridge = typeof EventBridge !== "undefined" ? EventBridge : null;
    var bridgeText = document.getElementById("bridge");
    var lastText = document.getElementById("last");
    bridgeText.textContent = bridge ? "Script: connected" : "Script: none (preview)";

    function send(event) {
        var message = JSON.stringify(event);
        lastText.textContent = "sent " + event.action + (event.songId ? " " + event.songId : "");
        if (bridge) {
            bridge.emitWebEvent(message);
        } else {
            console.log("piano-display", message);
        }
    }

    if (bridge) {
        bridge.scriptEventReceived.connect(function (message) {
            try {
                var reply = JSON.parse(message);
                if (reply && reply.type === "piano-display-ack") {
                    lastText.textContent = "ack " + reply.action + (reply.songId ? " " + reply.songId : "");
                }
            } catch (e) {
                // Not ours
            }
        });
    }

    document.querySelectorAll("[data-action]").forEach(function (button) {
        button.addEventListener("click", function () {
            send({ type: "piano-display", action: button.getAttribute("data-action") });
        });
    });
    document.querySelectorAll("[data-song]").forEach(function (button) {
        button.addEventListener("click", function () {
            send({ type: "piano-display", action: "play-song", songId: Number(button.getAttribute("data-song")) });
        });
    });
</script>
</body>
</html>
